---
layout: default
---

<article class="post-page">
  <header class="post-header">
    <p class="post-meta">{{ page.date | date: "%B %d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt_text %}<p class="post-lead">{{ page.excerpt_text }}</p>{% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
