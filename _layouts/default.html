<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>

  <button class="menu-toggle" id="menuToggle" aria-label="Open navigation">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect y="3" width="22" height="2" rx="1" fill="currentColor"/><rect y="10" width="22" height="2" rx="1" fill="currentColor"/><rect y="17" width="22" height="2" rx="1" fill="currentColor"/></svg>
  </button>

  <div class="overlay" id="overlay"></div>

  <aside class="sidenav" id="sidenav">
    <div class="sidenav-logo">
      <a href="{{ site.baseurl }}/">Tomb Raider Archives</a>
      <button class="sidenav-close" id="sidenavClose" aria-label="Close navigation">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><line x1="1" y1="1" x2="17" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="1" x2="1" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    {% include sidenav.html %}
  </aside>

  <main class="content" id="mainContent">
    <div class="page-wrap">
      {{ content }}
    </div>
  </main>

  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
