backend:
  name: github
  repo: tombraiderarchives/tombraiderarchives.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: dreamy-sherbet-28174d.netlify.app

logo_url: /images/ui/favicon.png

media_folder: "images/uploads"
public_folder: "/images/uploads"

# ── Collections ──────────────────────────────────────────────────────────────

collections:

  # ── News posts ──────────────────────────────────────────────────────────────
  - name: "news"
    label: "News"
    label_singular: "Post"
    folder: "news/_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    preview_path: "news/{{year}}/{{month}}/{{day}}/{{slug}}"
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "Category"
        field: category
    fields:
      - {label: "Layout",  name: "layout", widget: "hidden", default: "post"}

      # ── Core ──────────────────────────────────────────────────────────────
      - {label: "Title",   name: "title",  widget: "string",
         hint: "The headline — keep it clear and specific"}

      - {label: "Date",    name: "date",   widget: "datetime",
         date_format: "YYYY-MM-DD", time_format: false,
         hint: "Publish date"}

      # ── Categorisation ────────────────────────────────────────────────────
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        hint: "Primary label shown as a badge on the post"
        options:
          - "Announcement"
          - "Trailer"
          - "Release"
          - "Development Update"
          - "Archive Update"
          - "Media"
          - "Merchandise"
          - "Event"
          - "Rumour"

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Click '+ Add tags' for each keyword. e.g. crystal-dynamics, pc, switch"
        field: {label: "Tag", name: "tag", widget: "string"}

      # ── Media ─────────────────────────────────────────────────────────────
      - label: "Header Image"
        name: "header_image"
        widget: "image"
        required: false
        hint: "Banner image shown at the top of the post and on the news card"

      # ── Meta ──────────────────────────────────────────────────────────────
      - {label: "Author",  name: "author", widget: "string", required: false,
         hint: "Optional byline"}

      - {label: "Excerpt", name: "excerpt_text", widget: "text", required: false,
         hint: "Short teaser shown on the news listing (1–2 sentences)"}

      # ── Body ──────────────────────────────────────────────────────────────
      - {label: "Body",    name: "body",   widget: "markdown"}
