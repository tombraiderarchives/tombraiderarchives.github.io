<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager — Tomb Raider Archives</title>
  <link rel="icon" href="/images/ui/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Site design tokens (mirrors the main site) ─────────────────────── */
    :root {
      --bg:     #060504;
      --bg-2:   #0f0d09;
      --border: rgba(234,231,225,.07);
      --text:   #eae7e1;
      --muted:  #9a9388;
      --accent: #7ea583;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Dark canvas — forms the background on the login screen and frames the
       CMS pane once logged in. The editing area itself stays light so body
       text is easy to read — clearly "you are in edit mode". */
    html { background: var(--bg); color-scheme: dark; }
    body {
      background: var(--bg) !important;
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
      min-height: 100vh;
    }

    /* Apply Inter throughout the CMS */
    #nc-root { font-family: 'Inter', system-ui, sans-serif !important; }

    /* Login screen — give the auth card a dark canvas to sit on */
    [class*="AuthenticationPage"] { background: var(--bg) !important; }

    /* Nudge any CMS links toward the site's accent green */
    #nc-root a { color: var(--accent) !important; }

    /* Top toolbar */
    [class*="AppHeaderContent"],
    [class*="appHeader"] {
      background: var(--bg-2) !important;
      border-bottom: 1px solid var(--border) !important;
      font-family: 'Inter', system-ui, sans-serif !important;
    }

    /* Left navigation sidebar */
    [class*="Nav"], nav[class*="nav"] {
      background: var(--bg-2) !important;
      border-color: var(--border) !important;
      font-family: 'Inter', system-ui, sans-serif !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
