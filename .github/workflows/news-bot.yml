name: Tomb Raider News Bot

# Runs 5× daily at equal ~5-hour intervals.
# Can also be triggered manually from the GitHub Actions tab.
on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:

# Needs write access to commit new post files
permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the Puppeteer-managed Chrome binary so it doesn't re-download
      # on every run (~170 MB). Key only changes when package.json changes.
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ hashFiles('package.json') }}
          restore-keys: puppeteer-chrome-

      - name: Install dependencies
        run: npm install

      - name: Fetch and write news posts
        run: node scripts/news-bot.js
        env:
          # Optional — if set, Claude Haiku writes a proper article summary.
          # Add in GitHub → Settings → Secrets → Actions → New secret.
          # Name: ANTHROPIC_API_KEY   Value: your key from console.anthropic.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push new posts (if any)
        run: |
          git config user.name  "Tomb Raider News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          mkdir -p news/_posts/
          git add news/_posts/
          if git diff --staged --quiet; then
            echo "No new posts — nothing to commit."
          else
            COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
            # No [skip ci] — we WANT the push to trigger the deploy workflow
            # so new posts go live automatically. No recursion risk: this
            # workflow only runs on 'schedule' and 'workflow_dispatch'.
            git commit -m "bot: add ${COUNT} Tomb Raider news post(s)"
            git push origin main
            echo "Pushed ${COUNT} new post(s)."
          fi
