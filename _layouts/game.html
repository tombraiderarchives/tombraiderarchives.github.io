---
layout: default
---

<h1>{{ page.title }}</h1>

{% if page.cover_image %}
<img src="{{ page.cover_image }}" alt="{{ page.title }} cover" style="max-width:200px;">
{% endif %}

{% if page.description %}
<p>{{ page.description }}</p>
{% endif %}

{% if page.stats %}
<h2>Info</h2>
<table>
  {% for stat in page.stats %}
  <tr><th>{{ stat[0] | replace: '_', ' ' | capitalize }}</th><td>{{ stat[1] }}</td></tr>
  {% endfor %}
</table>
{% endif %}

{{ content }}
