<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>

<body>
  {% include header.html %}

  <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect y="3" width="20" height="1.75" rx="1" fill="currentColor"/>
      <rect y="9" width="20" height="1.75" rx="1" fill="currentColor"/>
      <rect y="15" width="20" height="1.75" rx="1" fill="currentColor"/>
    </svg>
  </button>

    <main class="content">
      <div class="container">
        {{ content }}
      </div>
    </main>
  </div>

  <aside class="sidenav" id="sidenav">
    <div class="sidenav-header">
      <a href="{{ site.baseurl }}/" class="sidenav-logo">Tomb Raider Archives</a>
      <button class="sidenav-close" id="sidenavClose" aria-label="Close menu">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <line x1="1" y1="1" x2="15" y2="15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          <line x1="15" y1="1" x2="1" y2="15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    {% include sidenav.html %}
  </aside>

  <main class="main" id="mainContent">
    <div class="page-wrap">
      {{ content }}
    </div>
  </main>

  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
