name: Tomb Raider News Bot

# Runs 5× daily at equal ~5-hour intervals.
# Can also be triggered manually from the GitHub Actions tab.
on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:

# Needs write access to commit new post files and trigger the deploy workflow
permissions:
  contents: write
  actions: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cache the Puppeteer-managed Chrome binary so it doesn't re-download
      # on every run (~170 MB). Key only changes when package.json changes.
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ hashFiles('package.json') }}
          restore-keys: puppeteer-chrome-

      - name: Install dependencies
        run: npm install

      - name: Fetch and write news posts
        run: node scripts/news-bot.js
        env:
          # Optional — if set, Claude Haiku writes a proper article summary.
          # Add in GitHub → Settings → Secrets → Actions → New secret.
          # Name: ANTHROPIC_API_KEY   Value: your key from console.anthropic.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push new posts (if any)
        id: commit
        run: |
          git config user.name  "Tomb Raider News Bot"
          git config user.email "news-bot@users.noreply.github.com"
          mkdir -p news/_posts/ _data/
          git add news/_posts/ _data/
          if git diff --staged --quiet; then
            echo "No new posts or YouTube data changes — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(git diff --staged --name-only -- 'news/_posts/' | wc -l | tr -d ' ')
            git commit -m "bot: add ${COUNT} Tomb Raider news post(s), update YouTube data"
            git push origin main
            echo "Pushed ${COUNT} new post(s) + YouTube data."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN pushes do NOT trigger push-event workflows (GitHub's
      # anti-recursion rule). So we manually fire the deploy workflow via the
      # API to ensure new posts are built and go live immediately.
      - name: Trigger site deploy
        if: steps.commit.outputs.pushed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deploy workflow triggered — site will rebuild shortly."
